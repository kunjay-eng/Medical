<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Scan QR — Medical Manager</title>

<!-- แก้ v1.63 (ตามที่ผู้ใช้ขอ): ต่อ "?v=" ท้าย URL ของ scanner.css/scanner.js ให้ตรงกับเลขเวอร์ชันไฟล์เสมอ
     — เหตุผล: ผู้ใช้แจ้งว่าอัปโหลดไฟล์แก้ล่าสุดขึ้น GitHub Pages แล้วแต่ยังเจอ error ข้อความเดิมอยู่ สาเหตุที่พบ
     บ่อยที่สุดของอาการแบบนี้คือเบราว์เซอร์ (หรือแคชของ GitHub Pages/CDN เอง) ยังเก็บไฟล์ .css/.js เวอร์ชันเก่า
     ไว้อยู่ ไม่ยอมโหลดไฟล์ใหม่ให้ทั้งที่เนื้อไฟล์บนเซิร์ฟเวอร์อัปเดตแล้วจริง — การเติม query string ต่อท้าย URL
     (เช่น scanner.js?v=1.63) ทำให้เบราว์เซอร์มองว่าเป็นคนละ URL กับที่แคชไว้ จึงบังคับให้ดึงไฟล์ใหม่จริง ๆ ทุก
     ครั้งที่เลขเวอร์ชันเปลี่ยน ครั้งต่อ ๆ ไปที่แก้ scanner.css/scanner.js อย่าลืมขยับเลขนี้ให้ตรงกับ SCANNER_VERSION
     ใน scanner.js ด้วยเสมอ -->
<link rel="stylesheet" href="scanner.css?v=1.63">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>


</head>

<body>

<div id="loading">

    <div class="spinner"></div>

    <div class="text">
        กำลังเปิดกล้อง...
    </div>

</div>



<video
    id="video"
    playsinline
    autoplay
    muted>
</video>


<div id="overlay">

    <div id="scanFrame">

        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div id="scanLine"></div>

    </div>

</div>


<div id="message">

    เล็ง QR Code ให้อยู่ในกรอบ

</div>


<div id="toolbar">

    <button id="flashBtn">
        🔦
    </button>

    <button id="switchBtn">
        🔄
    </button>

    <button id="imageBtn">
        🖼️
    </button>

    <button id="closeBtn">
        ✕
    </button>

</div>

<!-- แก้ v1.60 (รายงานผู้ใช้: เปิดกล้องแล้วกดปุ่ม "🖼️ เลือกรูปภาพ" เพื่อสแกนจากรูปไม่ได้ — ตัวเลือกรูปภาพ
     ของเครื่องไม่เด้งขึ้นมาเลย): เดิมซ่อน input ไฟล์นี้ด้วย attribute "hidden" (เท่ากับ display:none) แล้ว
     สั่งเปิดด้วย qrFile.click() จาก JS — เบราว์เซอร์บางตัว โดยเฉพาะ iOS Safari/WebView บางเวอร์ชัน มีบั๊กที่
     รู้จักกันดี: การเรียก .click() แบบสั่งจาก JS (ไม่ใช่คนแตะ input ตรง ๆ) กับ input ที่เป็น display:none จะไม่เปิด
     ตัวเลือกไฟล์ให้เลย (เงียบ ๆ ไม่มี error ด้วย) ต่างจาก input ที่ซ่อนด้วยวิธีอื่น (เช่น opacity:0 + ขยับออกนอกจอ)
     ที่ยังอยู่ใน layout จริง ซึ่งใช้ .click() ได้ปกติ — แก้โดยเอา "hidden" ออก แล้วซ่อนด้วย CSS คลาส
     "visually-hidden-file" ใน scanner.css แทน (ดูคอมเมนต์ที่นั่น) -->
<input
    type="file"
    id="qrFile"
    class="visually-hidden-file"
    accept="image/*">

<canvas id="canvas" hidden></canvas>


<script>

const SESSION =
    new URLSearchParams(location.search)
    .get("session") || "";

</script>

<script src="scanner.js?v=1.63"></script>

</body>
</html>
